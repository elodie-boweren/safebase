server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router: unknown paths (e.g. /dashboard after a reload) serve the app
  location / {
    try_files $uri $uri/ /index.html;
  }

  # built files have a hash in their name: they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
