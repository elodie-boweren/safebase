
services:
  mysql:
    image: mysql:8.4
    container_name: safebase_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo_mysql
      MYSQL_USER: safebase
      MYSQL_PASSWORD: safebasepass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/seeds/mysql/01_test_databases.sql:/docker-entrypoint-initdb.d/01_test_databases.sql

  postgres:
    image: postgres:16
    container_name: safebase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo_postgres
      POSTGRES_USER: safebase
      POSTGRES_PASSWORD: safebasepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./db/seeds/postgres/01_test_databases.sql:/docker-entrypoint-initdb.d/01_test_databases.sql

  mongodb:
    image: mongo:7
    container_name: safebase_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: safebase
      MONGO_INITDB_ROOT_PASSWORD: safebasepass
      MONGO_INITDB_DATABASE: demo_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: safebase_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-safebase_secret_key}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: demo_mysql
      MYSQL_USER: safebase
      MYSQL_PASSWORD: safebasepass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: demo_postgres
      POSTGRES_USER: safebase
      POSTGRES_PASSWORD: safebasepass
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: demo_mongo
      MONGO_USER: safebase
      MONGO_PASSWORD: safebasepass
      BACKUP_DIR: /app/backups
    ports:
      - "3000:3000"
    volumes:
      # backup files are written in ./backups on your computer
      - ./backups:/app/backups
    depends_on:
      - mysql
      - postgres
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL of the API as seen from the browser
        VITE_API_URL: http://localhost:3000
    container_name: safebase_frontend
    restart: unless-stopped
    # same port as "npm run dev": the API only accepts requests from http://localhost:5173 (CORS)
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
