services:
  mysql:
    image: mysql:8.4
    container_name: safebase_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo_mysql
      MYSQL_USER: safebase
      MYSQL_PASSWORD: safebasepass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [safebase]

  postgres:
    image: postgres:16
    container_name: safebase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo_postgres
      POSTGRES_USER: safebase
      POSTGRES_PASSWORD: safebasepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [safebase]

  mongodb:
    image: mongo:7
    container_name: safebase_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: safebase
      MONGO_INITDB_ROOT_PASSWORD: safebasepass
      MONGO_INITDB_DATABASE: demo_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [safebase]

backend:
    build: ./backend
    container_name: safebase_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3000
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb
      BACKUP_DIR: /backups
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src       
      - ./backups:/backups            
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: [safebase]
  

volumes:
  mysql_data:
  postgres_data:
  mongo_data:

networks:
  safebase: