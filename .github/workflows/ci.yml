name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (tests Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api        
    steps:
      - uses: actions/checkout@v4      
      - uses: actions/setup-node@v4    
        with:
          node-version: 22            
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci 
      - run: npm run lint                   
      - run: npm test

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run           
      - run: npm run build
